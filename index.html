<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Lantern</title>

    <base href="/" />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#14110F" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="A quiet place to focus, and to revisit what you studied on day 4 and day 7." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lantern" />

    <!-- Set the theme before first paint so the lamp never flashes the wrong colour. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lantern.theme') || 'dark';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'dark';
          document.documentElement.setAttribute('data-theme', t === 'paper' ? 'paper' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
